name: Emerald interface checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Test navigation helpers
        run: npm test
