name: Publish version release
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release from VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION | tr -d '\n\r')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Emerald Browser $TAG — Marble Edition" --notes-file RELEASE_NOTES_2.0.0.md
          fi
